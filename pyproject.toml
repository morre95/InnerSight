[project]
name = "innersight"
version = "0.1.1"
description = "Recognize UNO cards, rank and color, in images and live video"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "opencv-python>=4.10",
    "pocket-tts>=4.0.1",
    "pyyaml>=6.0",
    "sounddevice>=0.5.6",
    "ultralytics>=8.4",
]

[project.scripts]
innersight = "innersight.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]
export = [
    "onnx>=1.16,<2.0",
    "onnxruntime>=1.20",
    "onnxslim>=0.1.82",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
# The inbox in server/ is a project of its own and is checked with these settings as well.
src = [".", "src", "server/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
