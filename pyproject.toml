[project]
name = "innersight"
version = "0.1.0"
description = "Recognize UNO cards, rank and color, in images and live video"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "opencv-python>=4.10",
    "pyyaml>=6.0",
    "ultralytics>=8.4",
]

[project.scripts]
innersight = "innersight.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
