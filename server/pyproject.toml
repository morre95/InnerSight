[project]
name = "innersight-inbox"
version = "0.1.0"
description = "Receives the training examples that the InnerSight app collects in games"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.18",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
