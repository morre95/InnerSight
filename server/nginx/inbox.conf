# The inbox behind an nginx that is already on the server. Copy to
# /etc/nginx/sites-available/innersight-inbox, put in the domain, link it into sites-enabled,
# and let certbot add the certificate: certbot --nginx -d inbox.example.com
server {
    listen 80;
    server_name inbox.example.com;

    # A request larger than a picture can be is refused before the inbox reads it.
    client_max_body_size 6m;

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
